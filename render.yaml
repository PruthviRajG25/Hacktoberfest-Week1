services:
  - type: web
    name: touch-grass-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: SKIP_HEAVY_MODELS
        value: "true"
